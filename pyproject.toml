[build-system]
requires = ["flit_core >=3.2,<4"]
build-backend = "flit_core.buildapi"

[project]
name = "mibici"
version = "0.0.1"
description = "Predicci\u00f3n de viajes, aproximaci\u00f3n de riesgo y patrones de uso de MiBici."
authors = [
  { name = "Equipo 26 TC5061" },
]

readme = "README.md"
classifiers = [
    "Programming Language :: Python :: 3",
    
]
requires-python = "~=3.13.0"


[tool.uv]
# Las dependencias se manejan con requirements.in y requirements.txt.
# Esto desactiva uv add y uv sync para no crear un uv.lock paralelo.
managed = false

[tool.ruff]
line-length = 99
src = ["mibici"]
include = ["pyproject.toml", "mibici/**/*.py", "tests/**/*.py", "validacion_datos/**/*.py"]

[tool.ruff.lint]
extend-select = ["I"]  # Add import sorting

[tool.ruff.lint.isort]
known-first-party = ["mibici", "validacion_datos"]
force-sort-within-sections = true

