name: Semana 10 - CI MiBici

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  tests:
    name: Pruebas automatizadas
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Obtener el repositorio
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - name: Configurar Python 3.13
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7
        with:
          python-version: "3.13"

      - name: Instalar dependencias
        run: python -m pip install -r requirements.txt

      - name: Ejecutar pruebas
        run: python -m pytest -q

  docker-build:
    name: Construccion de imagen Docker
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Obtener el repositorio
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - name: Preparar artefacto temporal para verificar el build
        run: |
          mkdir -p models/ci-build-only
          printf 'Artefacto temporal exclusivo para CI\n' > models/ci-build-only/CI_BUILD_ONLY.txt

      - name: Construir imagen Docker
        run: |
          docker build \
            -f Containerfile \
            -t mibici-p1-api:ci-build-only \
            --build-arg MODEL_DIR=models/ci-build-only \
            .
