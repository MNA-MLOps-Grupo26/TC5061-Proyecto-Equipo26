name: Semana 10 - CI MiBici

on:
  push:
  pull_request:

permissions:
  contents: read

# Si llega un push nuevo a la misma rama o PR, se cancela la corrida anterior.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  tests:
    name: Pruebas automatizadas
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Obtener el repositorio
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - name: Configurar Python 3.13 con caché de pip
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: requirements.txt

      - name: Instalar dependencias
        run: python -m pip install -r requirements.txt

      - name: Ejecutar pruebas
        run: python -m pytest -q

  docker-build:
    name: Construccion de imagen Docker
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Obtener el repositorio
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - name: Preparar artefacto temporal para verificar el build
        run: |
          mkdir -p models/ci-build-only
          printf 'Artefacto temporal exclusivo para CI\n' > models/ci-build-only/CI_BUILD_ONLY.txt

      - name: Configurar Docker Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      # La caché de capas de GitHub Actions evita reinstalar las dependencias de la
      # imagen cuando solo cambia el código.
      - name: Construir imagen Docker con caché de capas
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          file: Containerfile
          build-args: MODEL_DIR=models/ci-build-only
          tags: mibici-p1-api:ci-build-only
          push: false
          cache-from: type=gha,scope=api
          cache-to: type=gha,scope=api,mode=max

  compose-smoke:
    name: Levantamiento con Docker Compose
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      # El modelo real no está en Git: se usa uno sintético con la misma firma.
      MODEL_DIR: models/ci-smoke
      API_PORT: "8000"
      MLFLOW_PORT: "5055"

    steps:
      - name: Obtener el repositorio
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - name: Configurar Python 3.13 con caché de pip
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: api/requirements.txt

      # Mismas versiones que la imagen de la API, para que el modelo cargue igual.
      - name: Generar modelo sintético para la prueba
        run: |
          python -m pip install -r api/requirements.txt
          python scripts/modelo_ci.py --destino "$MODEL_DIR"

      - name: Validar docker-compose.yml
        run: docker compose config --quiet

      - name: Levantar servicios y esperar healthchecks
        run: docker compose up -d --build --wait --wait-timeout 300

      - name: Probar MLflow, /health y /predict
        run: |
          set -euo pipefail
          docker compose ps
          curl -fsS "http://127.0.0.1:${MLFLOW_PORT}/health"
          echo
          curl -fsS "http://127.0.0.1:${API_PORT}/health" | tee health.json
          echo
          curl -fsS -X POST "http://127.0.0.1:${API_PORT}/predict" \
            -H "Content-Type: application/json" \
            --data @docs/evidencia-api/peticion-predict.json | tee predict.json
          echo
          python - <<'EOF'
          import json
          salud = json.load(open("health.json"))
          pred = json.load(open("predict.json"))
          assert salud["estado"] == "ok", salud
          assert isinstance(pred["viajes_esperados"], float), pred
          print("Smoke test de Compose correcto")
          EOF

      - name: Verificar OMP_NUM_THREADS en la API
        run: test "$(docker compose exec -T api printenv OMP_NUM_THREADS)" = "1"

      - name: Mostrar logs si algo falla
        if: failure()
        run: docker compose logs --no-color

      - name: Apagar servicios
        if: always()
        run: docker compose down -v
