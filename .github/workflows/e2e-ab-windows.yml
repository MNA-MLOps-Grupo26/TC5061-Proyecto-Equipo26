name: E2E A/B v1 frente a v3 en Windows

# Prueba aislada: solo se ejecuta a mano. Descarga todo desde cero, reentrena v1,
# evalúa octubre y calcula el A/B. Solo conserva JSON y Markdown (sin datos ni modelos).
on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  e2e:
    runs-on: windows-2025
    timeout-minutes: 90
    env:
      OMP_NUM_THREADS: "2"
      OPENBLAS_NUM_THREADS: "2"
      MKL_NUM_THREADS: "2"
      PYTHONUTF8: "1"
      PYTHONUNBUFFERED: "1"
      MLFLOW_DISABLE_AGENT_HINT: "1"
    steps:
      - name: Obtener el codigo sin credenciales persistentes
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - name: Python 3.13.5 x64 (mismo que el diagnostico del PR 26)
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7
        with:
          python-version: "3.13.5"
          architecture: x64
      - name: Instalar requirements-accuracy.txt (congelado en Windows)
        run: |
          python -m pip install -r requirements-accuracy.txt
          python -m pip install --no-deps -e .
      - name: Pruebas sinteticas relacionadas
        run: python -m pytest -q tests/test_ab_testing.py tests/test_challenger_monitoring.py tests/test_accuracy_monitoring.py tests/test_residual_model.py tests/test_local_residual_package.py tests/test_monitoring.py
      - name: Ingesta desde cero (CSV historicos y catalogo con respaldo verificado)
        run: python -m mibici.dataset
      - name: Descargar octubre y verificar SHA-256
        run: python scripts/e2e_ab_v1_v3.py october --out e2e/raw-october
      - name: Reentrenar v1 desde cero (sin registro MLflow)
        run: python scripts/e2e_ab_v1_v3.py train-v1 --out e2e/v1-reentrenado --summary e2e/entrenamiento-v1.json
      - name: Evaluar v1 en septiembre y octubre
        run: python -m mibici.accuracy_monitoring --source data/processed --october e2e/raw-october/datos_abiertos_2026_10.csv --model e2e/v1-reentrenado --out e2e/accuracy-p1
      - name: Predicciones pareadas v1 y v3 portable
        run: python -m mibici.ab_testing predict --current e2e/accuracy-p1/current.parquet --original-predictions e2e/accuracy-p1/october_predictions.parquet --original-model e2e/v1-reentrenado --out e2e/ab
      - name: A/B y comparacion con el reporte
        run: python -m mibici.ab_testing compare --predictions e2e/ab/predictions.parquet --provenance e2e/ab/provenance.json --reference docs/week9-evidence/comparison.json --out e2e/ab
      - name: Diagnostico de latitud
        run: python docs/week9-evidence/ab-v1-v3-20261115/diagnostico_v1.py --current e2e/accuracy-p1/current.parquet --original-model e2e/v1-reentrenado --out e2e/diagnostico-v1.json
      - name: Resumen
        run: python scripts/e2e_ab_v1_v3.py summary --root e2e --out e2e/resumen-e2e.json
      - name: Conservar solo resultados; sin datos ni modelos
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: e2e-ab-windows
          path: |
            e2e/resumen-e2e.json
            e2e/entrenamiento-v1.json
            e2e/diagnostico-v1.json
            e2e/accuracy-p1/accuracy.json
            e2e/accuracy-p1/summary.json
            e2e/ab/ab_results.json
            e2e/ab/ab_table.md
            e2e/ab/provenance.json
          retention-days: 14
          if-no-files-found: warn
